<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Map Editor - Tanks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet">
    <link href="editor/editor.css" rel="stylesheet">
</head>
<body>
    <!-- Вхід за паролем адміна -->
    <div id="login-overlay">
        <div id="login-box">
            <h1 class="text-2xl font-russo text-blue-400 tracking-widest">ULTIMATE EDITOR</h1>
            <p class="text-xs text-slate-400 mt-1">Введіть пароль адміністратора</p>
            <input type="password" id="login-pass" autocomplete="off" autofocus>
            <div id="login-err"></div>
            <button id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-russo uppercase tracking-widest text-white">УВІЙТИ</button>
        </div>
    </div>

    <div class="w-[360px] h-screen bg-slate-900 border-r border-slate-700 flex flex-col absolute left-0 top-0 z-10 shadow-2xl">
        <div class="p-4 pb-0">
            <h1 class="text-2xl font-russo text-blue-400 mb-3 tracking-widest text-center">ULTIMATE EDITOR</h1>
            <div class="flex border-b border-slate-700 mb-3 overflow-x-auto" id="tabs-container"></div>
        </div>
        <div class="flex-1 overflow-y-auto px-4 pb-4" id="tools-container"></div>
        <div class="p-3 border-t border-slate-700 bg-slate-900">
            <button id="save-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl text-base font-russo uppercase tracking-widest transition text-white mb-2">💾 ЗБЕРЕГТИ НА СЕРВЕР</button>
            <div class="flex gap-2">
                <button id="clear-btn" class="flex-1 py-2 rounded-xl font-bold uppercase tracking-widest text-slate-400 border border-slate-700 hover:bg-slate-800 hover:text-red-400 transition text-[10px]">Очистити все</button>
                <button id="export-btn" class="flex-1 py-2 rounded-xl font-bold uppercase tracking-widest text-blue-300 border border-blue-900 hover:bg-blue-900/40 transition text-[10px]">Експорт коду</button>
            </div>
        </div>
    </div>

    <div id="topbar">
        <button class="top-btn" id="tb-select" title="Вибір / переміщення (V)">🖱 Вибір <span class="kbd">V</span></button>
        <button class="top-btn" id="tb-eraser" title="Гумка (E)">🧽 Гумка <span class="kbd">E</span></button>
        <div class="top-sep"></div>
        <button class="top-btn" id="tb-undo" title="Відмінити (Ctrl+Z)">↶ <span class="kbd">Ctrl+Z</span></button>
        <button class="top-btn" id="tb-redo" title="Повернути (Ctrl+Y)">↷ <span class="kbd">Ctrl+Y</span></button>
        <div class="top-sep"></div>
        <button class="top-btn" id="tb-zoom-out" title="Зменшити (-)">−</button>
        <span class="top-btn" id="tb-zoom-val" style="cursor:default">100%</span>
        <button class="top-btn" id="tb-zoom-in" title="Збільшити (+)">+</button>
        <button class="top-btn" id="tb-fit" title="Вмістити (F)">Вмістити <span class="kbd">F</span></button>
        <div id="status-line">Готово</div>
    </div>

    <div id="canvas-wrapper"><canvas id="map-canvas"></canvas></div>

    <!-- Міні-меню об'єкта -->
    <div id="obj-menu" class="hidden"></div>

    <div id="export-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-8">
        <div class="bg-slate-900 p-8 rounded-3xl w-full max-w-4xl border border-blue-500/50 flex flex-col h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-russo text-blue-400 tracking-widest">КОД МАПИ</h2>
                <button id="export-close" class="text-slate-400 hover:text-white font-bold text-2xl">✖</button>
            </div>
            <textarea id="export-textarea" class="w-full flex-1 bg-[#020617] text-emerald-400 p-5 rounded-xl font-mono text-sm border border-slate-700 focus:outline-none focus:border-blue-500 mb-6 resize-none" readonly></textarea>
            <button id="export-copy" class="w-full bg-emerald-600 py-5 rounded-xl text-2xl font-russo text-white">СКОПІЮВАТИ ДО БУФЕРУ</button>
        </div>
    </div>

    <!-- Спільний модуль гри та редактора -->
    <script src="js/mapobjects.js"></script>
    <script src="js/mapfx.js"></script>
    <!-- Файли редактора -->
    <script src="editor/editor-data.js"></script>
    <script src="editor/editor-api.js"></script>
    <script src="editor/editor-history.js"></script>
    <script src="editor/editor-render.js"></script>
    <script src="editor/editor-tools.js"></script>
    <script src="editor/editor-app.js"></script>
</body>
</html>
